<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Контакты | Dental Club</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contacts.css">
    <link rel="stylesheet" href="../media/contacts_media.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu-btn" id="closeMenuBtn">
            <span></span>
            <span></span>
        </div>
        <nav class="mobile-nav">
            <a href="#" class="mobile-menu-btn">МЕНЮ</a>
            <a href="#" class="mobile-lang-selector">RUS</a>
            <a href="#" class="mobile-login-link">ВОЙТИ</a>
            <a href="index.html" class="mobile-link">ГЛАВНАЯ</a>
            <a href="#" class="mobile-link">УСЛУГИ</a>
            <a href="#" class="mobile-link">КОМАНДА</a>
            <a href="#" class="mobile-link">ОТЗЫВЫ</a>
            <a href="contacts.html" class="mobile-link">КОНТАКТЫ</a>
        </nav>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <main>
        <section class="hero-contacts">
            <div class="hero-content">
                <h1>КОНТАКТЫ</h1>
                <button class="btn-white">ЗАПИСАТЬСЯ НА ПРИЕМ</button>
            </div>
            <div class="scroll-down"></div>
        </section>

        <section class="contacts-info-section">
            <div class="container">
                <div class="contacts-grid">
                    <div class="contacts-details">
                        <h2>СВЯЗАТЬСЯ С НАМИ</h2>
                        <div class="phones">
                            <a href="tel:+77273138812">+ 7 (727) 313-88-12</a>
                            <a href="tel:+77073138812">+ 7 (707) 313-88-12</a>
                        </div>
                        <p class="address">Казахстан, г. Алматы улица Хаджи Мукана 49<br>(вход со стороны Мендикулова)</p>
                        <p class="schedule">• &nbsp;Пн - Пт: 10.00 - 19.00</p>
                        <a href="mailto:dentalclubreception@gmail.com" class="email">dentalclubreception@gmail.com</a>
                        
                        <div class="social-icons">
                            <a href="#"><img src="../assets/images/icons/instagram.png" alt="Instagram"></a>
                            <a href="#"><img src="../assets/images/icons/youtube.png" alt="YouTube"></a>
                            <a href="#"><img src="../assets/images/icons/vk.png" alt="VK"></a>
                            <a href="#"><img src="../assets/images/icons/whatsapp.png" alt="WhatsApp"></a>
                        </div>
                    </div>
                    <div class="contacts-cta">
                         <button class="btn-outline">ЗАПИСАТЬСЯ НА ПРИЕМ</button>
                    </div>
                </div>

                <div class="map-container">
                    <div class="map-image-side">
                        <img src="../assets/images/contacts/contacs2.jpg" alt="Reception">
                    </div>
                    <div class="map-iframe-wrapper">
                        <div id="map">
                            <img src="../assets/images/contacts/contacs3.png" alt="Карта">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="feedback-section">
            <div class="container feedback-flex">
                <div class="feedback-title">
                    <h2>ОБРАТНАЯ <br>СВЯЗЬ</h2>
                </div>
                <form class="feedback-form">
                    <input type="text" placeholder="Ваше имя" required>
                    <input type="email" placeholder="Email" required>
                    <input type="tel" placeholder="+7 (___) ___ __ __" required>
                    <textarea placeholder="Введите ваш вопрос"></textarea>
                    <button type="submit" class="btn-submit">ОТПРАВИТЬ ЗАЯВКУ</button>
                </form>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    
    <script src="../js/components.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const burgerIcon = document.getElementById('burgerIcon');
                const mobileMenu = document.getElementById('mobileMenu');
                const menuOverlay = document.getElementById('menuOverlay');
                const closeMenuBtn = document.getElementById('closeMenuBtn');
                const body = document.body;

                function openMenu() {
                    if (burgerIcon) burgerIcon.classList.add('active');
                    if (mobileMenu) mobileMenu.classList.add('active');
                    if (menuOverlay) menuOverlay.classList.add('active');
                    body.classList.add('menu-open');
                }

                function closeMenu() {
                    if (burgerIcon) burgerIcon.classList.remove('active');
                    if (mobileMenu) mobileMenu.classList.remove('active');
                    if (menuOverlay) menuOverlay.classList.remove('active');
                    body.classList.remove('menu-open');
                }

                if (burgerIcon) {
                    burgerIcon.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (mobileMenu && mobileMenu.classList.contains('active')) {
                            closeMenu();
                        } else {
                            openMenu();
                        }
                    });
                }

                if (closeMenuBtn) {
                    closeMenuBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        closeMenu();
                    });
                }

                if (menuOverlay) {
                    menuOverlay.addEventListener('click', closeMenu);
                }

                const mobileLinks = document.querySelectorAll('.mobile-menu-btn, .mobile-lang-selector, .mobile-login-link, .mobile-link');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', closeMenu);
                });

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 992 && mobileMenu && mobileMenu.classList.contains('active')) {
                        closeMenu();
                    }
                });
            }, 100);
        });
    </script>
</body>
</html>
