</head>
<body>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu-btn" id="closeMenuBtn">
            <span></span>

            <a href="#" class="mobile-lang-selector">ENG</a>
            
            <div class="mobile-theme-switcher">

                <span class="mobile-theme-icon" data-theme="light" title="Светлая тема">☀️ Светлая</span>

            <a href="#" id="mobileSpecialButton" class="mobile-special-button">👁️ Режим для слабовидящих</a>
            
      <a href="../index.html" class="mobile-link" data-translate="home">ГЛАВНАЯ</a>
            <a href="../pages/service-detail.html" class="mobile-link" data-translate="services">УСЛУГИ</a>
            <a href="../pages/team.html" class="mobile-link" data-translate="team">КОМАНДА</a>
            <a href="../pages/reviews.html" class="mobile-link" data-translate="reviews">ОТЗЫВЫ</a>
            <a href="../pages/contacts.html" class="mobile-link" data-translate="contacts">КОНТАКТЫ</a>

    <main>

            </div>
            <div class="scroll-down"></div>
        </section>

        <section class="faq-section">
            <div class="container">
                        <h2 class="visually-hidden" data-translate="faq_section_title">Часто задаваемые вопросы</h2>

                <div class="faq-categories">
                    <button class="category-btn active" data-category="all" data-translate="all_questions">Все вопросы</button>
                    <button class="category-btn" data-category="Запись и визиты"><span data-translate="booking_visits">📅 Запись и визиты</span></button>
                    <button class="category-btn" data-category="Услуги"><span data-translate="services_cat">🦷 Услуги</span></button>
                    <button class="category-btn" data-category="Цены и оплата"><span data-translate="prices_payment">💰 Цены и оплата</span></button>
                    <button class="category-btn" data-category="Врачи"><span data-translate="doctors_cat">👨‍⚕️ Врачи</span></button>
                    <button class="category-btn" data-category="Общие"><span data-translate="general_cat">ℹ️ Общие</span></button>
                </div>

                <div class="faq-search">
                    <input type="text" id="faqSearchInput" data-translate="search_questions" placeholder="🔍 Поиск по вопросам..." class="search-input">
                </div>

                <div id="faqList" class="faq-list">
                    <div class="loading" data-translate="loading">Загрузка...</div>
                </div>

                <div id="noResults" class="no-results" style="display: none;">
                    <div class="no-results-icon">🔍</div>

                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/localstorage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/modal-appointment.js"></script>
    <script src="../js/modal-profile.js"></script>
    <script src="../js/faq.js"></script>
    <script src="../js/preloader.js"></script>

    <script>
        function initMobileMenu() {
            setTimeout(function() {
                const burgerIcon = document.getElementById('burgerIcon');
                const mobileMenu = document.getElementById('mobileMenu');
                const menuOverlay = document.getElementById('menuOverlay');
                const closeMenuBtn = document.getElementById('closeMenuBtn');
                const body = document.body;

                if (!burgerIcon || !mobileMenu) return;

                let scrollPosition = 0;

                function openMenu() {
                    scrollPosition = window.pageYOffset;
                    burgerIcon.classList.add('active');
                    mobileMenu.classList.add('active');
                    if (menuOverlay) menuOverlay.classList.add('active');
                    body.classList.add('menu-open');
                    body.style.top = `-${scrollPosition}px`;
                }

                function closeMenu() {
                    burgerIcon.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    if (menuOverlay) menuOverlay.classList.remove('active');
                    body.classList.remove('menu-open');
                    body.style.top = '';
                    window.scrollTo(0, scrollPosition);
                }

                burgerIcon.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (mobileMenu.classList.contains('active')) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                };

                if (closeMenuBtn) {
                    closeMenuBtn.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        closeMenu();
                    };
                }

                if (menuOverlay) {
                    menuOverlay.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        closeMenu();
                    };
                }

                const mobileLinks = document.querySelectorAll('.mobile-menu-btn, .mobile-lang-selector, .mobile-login-link, .mobile-link, .mobile-theme-icon');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', function() {
                        if (!this.classList.contains('mobile-theme-icon')) {
                            setTimeout(closeMenu, 200);
                        }
                    });
                });

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 1200 && mobileMenu.classList.contains('active')) {
                        closeMenu();
                    }
                });
            }, 100);
        }

        function updateMobileLangButton() {
            const mobileLangSelector = document.querySelector('.mobile-lang-selector');
            if (mobileLangSelector) {
                const currentLang = localStorage.getItem('dental_language') || 'ru';
                mobileLangSelector.textContent = currentLang === 'ru' ? 'ENG' : 'RUS';
            }
        }

        function initMobileLangSwitcher() {
            const mobileLangSelector = document.querySelector('.mobile-lang-selector');
            if (mobileLangSelector) {
                const newSelector = mobileLangSelector.cloneNode(true);
                mobileLangSelector.parentNode.replaceChild(newSelector, mobileLangSelector);
                
                newSelector.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const currentLang = localStorage.getItem('dental_language') || 'ru';
                    const newLang = currentLang === 'ru' ? 'en' : 'ru';
                    
                    localStorage.setItem('dental_language', newLang);
                    
                    this.textContent = newLang === 'ru' ? 'ENG' : 'RUS';
                    
                    if (typeof window.switchLanguage === 'function') {
                        window.switchLanguage();
                    } else if (typeof window.applyTranslations === 'function') {
                        window.applyTranslations();
                    }
                    
                    const desktopLangText = document.getElementById('langSelectorText');
                    if (desktopLangText) {
                        desktopLangText.textContent = newLang === 'ru' ? 'ENG' : 'RUS';
                    }
                    
                    const event = new CustomEvent('languageChanged', { detail: { language: newLang } });
                    document.dispatchEvent(event);
                    
                    console.log('🌐 Язык изменён на:', newLang);
                });
            }
        }

        function syncMobileThemeWithDesktop() {
            const currentTheme = localStorage.getItem('dental_theme') || 'system';
            const mobileThemeIcons = document.querySelectorAll('.mobile-theme-icon');
            
            mobileThemeIcons.forEach(icon => {
                if (icon.dataset.theme === currentTheme) {
                    icon.classList.add('active');
                } else {
                    icon.classList.remove('active');
                }
            });
        }

        function initMobileThemeSwitcher() {
            const mobileThemeIcons = document.querySelectorAll('.mobile-theme-icon');
            
            mobileThemeIcons.forEach(icon => {
                icon.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const theme = this.dataset.theme;
                    
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('dental_theme', theme);
                    
                    mobileThemeIcons.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    
                    const desktopIcons = document.querySelectorAll('.theme-icon');
                    desktopIcons.forEach(desktopIcon => {
                        desktopIcon.classList.remove('active');
                        if ((theme === 'dark' && desktopIcon.classList.contains('theme-dark')) ||
                            (theme === 'light' && desktopIcon.classList.contains('theme-light')) ||
                            (theme === 'system' && desktopIcon.classList.contains('theme-system'))) {
                            desktopIcon.classList.add('active');
                        }
                    });
                });
            });
        }

        function initMobileSpecialButton() {
            const mobileSpecialBtn = document.getElementById('mobileSpecialButton');
            if (mobileSpecialBtn) {
                mobileSpecialBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const specialPanel = document.getElementById('specialPanel');
                    if (specialPanel) {
                        specialPanel.classList.toggle('active');
                    }
                });
            }
        }

        const openAppointmentBtn = document.getElementById('openAppointmentBtn');
        if (openAppointmentBtn && typeof openVisitorAppointmentModal === 'function') {
            openAppointmentBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openVisitorAppointmentModal();
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initMobileMenu();
            syncMobileThemeWithDesktop();
            initMobileThemeSwitcher();
            initMobileSpecialButton();
            updateMobileLangButton();
            initMobileLangSwitcher();
        });

        document.addEventListener('languageChanged', function() {
            updateMobileLangButton();
        });

        setTimeout(function() {
            if (typeof window.updateAuthUI === 'function') {
                window.updateAuthUI();
            }
            if (typeof window.applyTranslations === 'function') {
                window.applyTranslations();
            }
            syncMobileThemeWithDesktop();
        }, 200);

        const themeObserver = new MutationObserver(function() {
            syncMobileThemeWithDesktop();
        });
        
        themeObserver.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
        });
    </script>
    <script src="../js/special-version.js"></script>

</body>


</html>
