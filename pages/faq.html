<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-translate="faq_title">Вопрос-ответ | Dental Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@200;300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/faq.css">
    <link rel="stylesheet" href="../media/faq_media.css">
    <link rel="stylesheet" href="../css/modal-appointment.css">
    <link rel="stylesheet" href="../css/modal-profile.css">
    <link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/special-version.css">

<script src="../js/special-version.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu-btn" id="closeMenuBtn">
            <span></span>
            <span></span>
        </div>
        <nav class="mobile-nav">
            <div class="mobile-login-container" id="mobileLoginContainer">
                <a href="#" class="mobile-login-link" data-translate="login">ВОЙТИ</a>
            </div>
            <a href="#" class="mobile-menu-btn" data-translate="menu">МЕНЮ</a>
            <a href="#" class="mobile-lang-selector">RUS</a>
            <a href="index.html" class="mobile-link" data-translate="home">ГЛАВНАЯ</a>
            <a href="#" class="mobile-link" data-translate="services">УСЛУГИ</a>
            <a href="team.html" class="mobile-link" data-translate="team">КОМАНДА</a>
            <a href="reviews.html" class="mobile-link" data-translate="reviews">ОТЗЫВЫ</a>
            <a href="contacts.html" class="mobile-link" data-translate="contacts">КОНТАКТЫ</a>
            <a href="prices.html" class="mobile-link" data-translate="prices">ПРАЙС-ЛИСТ</a>
            <a href="schedule.html" class="mobile-link" data-translate="schedule">РАСПИСАНИЕ</a>
            <a href="faq.html" class="mobile-link" data-translate="faq">ВОПРОС-ОТВЕТ</a>
        </nav>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <main>
        <section class="hero-faq">
            <div class="hero-content">
                <h1 data-translate="faq_title">ВОПРОС-ОТВЕТ</h1>
                <p data-translate="faq_subtitle">Часто задаваемые вопросы о нашей клинике</p>
                <button class="btn-white" id="openAppointmentBtn" data-translate="appointment_btn">ЗАПИСАТЬСЯ НА ПРИЕМ</button>
            </div>
            <div class="scroll-down"></div>
        </section>

        <section class="faq-section">
            <div class="container">
                <div class="faq-categories">
                    <button class="category-btn active" data-category="all" data-translate="all_questions">Все вопросы</button>
                    <button class="category-btn" data-category="Запись и визиты"><span data-translate="booking_visits">📅 Запись и визиты</span></button>
                    <button class="category-btn" data-category="Услуги"><span data-translate="services_cat">🦷 Услуги</span></button>
                    <button class="category-btn" data-category="Цены и оплата"><span data-translate="prices_payment">💰 Цены и оплата</span></button>
                    <button class="category-btn" data-category="Врачи"><span data-translate="doctors_cat">👨‍⚕️ Врачи</span></button>
                    <button class="category-btn" data-category="Общие"><span data-translate="general_cat">ℹ️ Общие</span></button>
                </div>

                <div class="faq-search">
                    <input type="text" id="faqSearchInput" data-translate="search_questions" placeholder="🔍 Поиск по вопросам..." class="search-input">
                </div>

                <div id="faqList" class="faq-list">
                    <div class="loading" data-translate="loading">Загрузка...</div>
                </div>

                <div id="noResults" class="no-results" style="display: none;">
                    <div class="no-results-icon">🔍</div>
                    <p data-translate="no_results">По вашему запросу ничего не найдено</p>
                    <button class="btn-reset-faq" data-translate="reset_filters">Сбросить фильтры</button>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/localstorage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/modal-appointment.js"></script>
    <script src="../js/modal-profile.js"></script>
    <script src="../js/faq.js"></script>
    <script src="../js/preloader.js"></script>

    <script>
        const openAppointmentBtn = document.getElementById('openAppointmentBtn');
        if (openAppointmentBtn && typeof openVisitorAppointmentModal === 'function') {
            openAppointmentBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openVisitorAppointmentModal();
            });
        }

        setTimeout(function() {
            if (typeof window.updateAuthUI === 'function') {
                window.updateAuthUI();
            }
            if (typeof window.applyTranslations === 'function') {
                window.applyTranslations();
            }
        }, 200);
    </script>
</body>
</html>
