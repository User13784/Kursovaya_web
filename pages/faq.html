<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вопрос-ответ | Dental Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@200;300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/faq.css">
    <link rel="stylesheet" href="../media/faq_media.css">
    <link rel="stylesheet" href="../css/modal-appointment.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu-btn" id="closeMenuBtn">
            <span></span>
            <span></span>
        </div>
        <nav class="mobile-nav">
            <a href="#" class="mobile-menu-btn">МЕНЮ</a>
            <a href="#" class="mobile-lang-selector">RUS</a>
            <a href="#" class="mobile-login-link">ВОЙТИ</a>
            <a href="index.html" class="mobile-link">ГЛАВНАЯ</a>
            <a href="#" class="mobile-link">УСЛУГИ</a>
            <a href="team.html" class="mobile-link">КОМАНДА</a>
            <a href="reviews.html" class="mobile-link">ОТЗЫВЫ</a>
            <a href="contacts.html" class="mobile-link">КОНТАКТЫ</a>
            <a href="prices.html" class="mobile-link">ПРАЙС-ЛИСТ</a>
            <a href="faq.html" class="mobile-link">ВОПРОС-ОТВЕТ</a>
        </nav>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <main>
        <section class="hero-faq">
            <div class="hero-content">
                <h1>ВОПРОС-ОТВЕТ</h1>
                <p>Часто задаваемые вопросы о нашей клинике</p>
                <button class="btn-white" id="openAppointmentBtn">ЗАПИСАТЬСЯ НА ПРИЕМ</button>
            </div>
            <div class="scroll-down"></div>
        </section>

        <section class="faq-section">
            <div class="container">
                <div class="faq-categories">
                    <button class="category-btn active" data-category="all">Все вопросы</button>
                    <button class="category-btn" data-category="Запись и визиты">📅 Запись и визиты</button>
                    <button class="category-btn" data-category="Услуги">🦷 Услуги</button>
                    <button class="category-btn" data-category="Цены и оплата">💰 Цены и оплата</button>
                    <button class="category-btn" data-category="Врачи">👨‍⚕️ Врачи</button>
                    <button class="category-btn" data-category="Общие">ℹ️ Общие</button>
                </div>

                <div class="faq-search">
                    <input type="text" id="faqSearchInput" placeholder="🔍 Поиск по вопросам..." class="search-input">
                </div>

                <div id="faqList" class="faq-list">
                    <div class="loading">Загрузка...</div>
                </div>

                <div id="noResults" class="no-results" style="display: none;">
                    <div class="no-results-icon">🔍</div>
                    <p>По вашему запросу ничего не найдено</p>
                    <button class="btn-reset-faq">Сбросить фильтры</button>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/components.js"></script>
    <script src="../js/modal-appointment.js"></script>
    <script src="../js/faq.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const burgerIcon = document.getElementById('burgerIcon');
                const mobileMenu = document.getElementById('mobileMenu');
                const menuOverlay = document.getElementById('menuOverlay');
                const closeMenuBtn = document.getElementById('closeMenuBtn');
                const body = document.body;

                function openMenu() {
                    if (burgerIcon) burgerIcon.classList.add('active');
                    if (mobileMenu) mobileMenu.classList.add('active');
                    if (menuOverlay) menuOverlay.classList.add('active');
                    body.classList.add('menu-open');
                }

                function closeMenu() {
                    if (burgerIcon) burgerIcon.classList.remove('active');
                    if (mobileMenu) mobileMenu.classList.remove('active');
                    if (menuOverlay) menuOverlay.classList.remove('active');
                    body.classList.remove('menu-open');
                }

                if (burgerIcon) {
                    burgerIcon.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (mobileMenu && mobileMenu.classList.contains('active')) {
                            closeMenu();
                        } else {
                            openMenu();
                        }
                    });
                }

                if (closeMenuBtn) {
                    closeMenuBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        closeMenu();
                    });
                }

                if (menuOverlay) {
                    menuOverlay.addEventListener('click', closeMenu);
                }

                const mobileLinks = document.querySelectorAll('.mobile-menu-btn, .mobile-lang-selector, .mobile-login-link, .mobile-link');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', closeMenu);
                });

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 992 && mobileMenu && mobileMenu.classList.contains('active')) {
                        closeMenu();
                    }
                });
            }, 100);
            
            const openAppointmentBtn = document.getElementById('openAppointmentBtn');
            if (openAppointmentBtn && typeof openVisitorAppointmentModal === 'function') {
                openAppointmentBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    openVisitorAppointmentModal();
                });
            }
        });
    </script>
</body>
</html>
