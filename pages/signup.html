<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Dental Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap">
    <link rel="stylesheet" href="../css/signup.css">

</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-container">
            <div class="signup-card">
                <div class="signup-header">
                    <a href="index.html" class="signup-logo">
                        <img src="assets/images/logo.png" alt="Dental Club">
                    </a>
                    <h1>СОЗДАНИЕ АККАУНТА</h1>
                    <p>Заполните форму для регистрации</p>
                </div>

                <form id="signupForm" class="signup-form">
                    <div class="signup-form-row">
                        <div class="signup-form-group">
                            <label for="firstName">Имя</label>
                            <input type="text" id="firstName" name="firstName" placeholder="Введите ваше имя" required>
                            <span class="signup-error-message" id="firstNameError"></span>
                        </div>
                        <div class="signup-form-group">
                            <label for="lastName">Фамилия</label>
                            <input type="text" id="lastName" name="lastName" placeholder="Введите вашу фамилию" required>
                            <span class="signup-error-message" id="lastNameError"></span>
                        </div>
                    </div>

                    <div class="signup-form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                        <span class="signup-error-message" id="emailError"></span>
                    </div>

                    <div class="signup-form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (XXX) XXX-XX-XX" required>
                        <span class="signup-error-message" id="phoneError"></span>
                    </div>

                    <div class="signup-form-row">
                        <div class="signup-form-group">
                            <label for="password">Пароль</label>
                            <div class="signup-password-wrapper">
                                <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required>
                                <button type="button" class="signup-toggle-password" data-target="password">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="signup-error-message" id="passwordError"></span>
                        </div>
                        <div class="signup-form-group">
                            <label for="confirmPassword">Подтверждение пароля</label>
                            <div class="signup-password-wrapper">
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
                                <button type="button" class="signup-toggle-password" data-target="confirmPassword">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="signup-error-message" id="confirmPasswordError"></span>
                        </div>
                    </div>

                    <div class="signup-form-group signup-checkbox-group">
                        <label class="signup-checkbox-label">
                            <input type="checkbox" id="agreeTerms" required>
                            <span class="signup-checkmark"></span>
                            <span class="signup-agree-text">Я соглашаюсь с <a href="#">условиями использования</a> и <a href="#">политикой конфиденциальности</a></span>
                        </label>
                        <span class="signup-error-message" id="termsError"></span>
                    </div>

                    <button type="submit" class="signup-btn signup-btn-primary">ЗАРЕГИСТРИРОВАТЬСЯ</button>

                    <div class="signup-footer">
                        <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                    </div>
                </form>

                <div class="signup-divider">
                    <span>ИЛИ</span>
                </div>

                <div class="signup-social">
                    <button type="button" class="signup-social-btn google">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="signup-social-btn apple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17.36 3 13.16 5.32 10.3c1.16-1.44 3.01-2.35 4.78-2.37 1.5-.02 2.92.99 3.84.99.92 0 2.64-1.22 4.46-1.04.76.03 2.89.31 4.26 2.33-.11.07-2.55 1.49-2.52 4.45.03 2.52 2.2 3.36 2.27 3.38-.02.07-.35 1.21-1.16 2.4zM16.32 4.9c.74-.9 1.23-2.14 1.1-3.4-.86.04-1.95.57-2.59 1.29-.6.68-1.12 1.66-1 2.71.92.07 1.86-.48 2.49-1.2z"/>
                        </svg>
                        Apple
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/signup.js"></script>
</body>
</html>
