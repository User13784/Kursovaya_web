<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Врач | Dental Club</title>
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/team-details.css" />
    <link rel="stylesheet" href="../media/team-details_media.css" />
    <link rel="stylesheet" href="../css/modal-appointment.css">
    <script src="../js/api.js"></script>


</head>
<body>
    <div id="header-placeholder"></div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu-btn" id="closeMenuBtn">
            <span></span>
            <span></span>
        </div>
        <nav class="mobile-nav">
            <a href="#" class="mobile-menu-btn">МЕНЮ</a>
            <a href="#" class="mobile-lang-selector">RUS</a>
            <a href="#" class="mobile-login-link">ВОЙТИ</a>
            <a href="index.html" class="mobile-link">ГЛАВНАЯ</a>
            <a href="#" class="mobile-link">УСЛУГИ</a>
            <a href="team.html" class="mobile-link">КОМАНДА</a>
            <a href="#" class="mobile-link">ОТЗЫВЫ</a>
            <a href="contacts.html" class="mobile-link">КОНТАКТЫ</a>
        </nav>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <main class="doctor-profile">
        <div class="container">
            <div class="doctor-card">
                <div class="doctor-photo">
                    <img id="doctor-photo" src="" alt="Фото врача" />
                </div>

                <div class="doctor-details">
                    <p id="doctor-subtitle" class="doctor-subtitle"></p>
                    <h1 id="doctor-name" class="doctor-name"></h1>

                    <div class="info-block spec">
                        <h4 class="spec-title">Специализация:</h4>
                        <p id="spec-desc" class="spec-desc"></p>
                    </div>

                    <div class="info-block edu">
                        <h4 class="edu-title">Образование:</h4>
                        <p id="edu-desc" class="edu-desc"></p>
                    </div>

                    <div class="info-block exp">
                        <h4 class="exp-title">Опыт работы:</h4>
                        <p id="exp-desc" class="exp-desc"></p>
                    </div>

                    <div class="info-block improve">
                        <h4 class="improve-title">Усовершенствования:</h4>
                        <p id="improve-desc" class="improve-desc"></p>
                    </div>

                    <div class="info-block time">
                        <h4 class="time-title">Время приема:</h4>
                        <p id="time-desc" class="time-desc"></p>
                    </div>

                    <button class="btn-submit">ЗАПИСАТЬСЯ НА ПРИЕМ</button>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/components.js"></script>
    <script src="../js/doctors-data.js"></script>
    <script>
        const doctorId = sessionStorage.getItem('selectedDoctorId') || 1;
        const doctor = doctorsData[doctorId];
        
        if (doctor) {
            document.getElementById('doctor-photo').src = doctor.photo;
            document.getElementById('doctor-subtitle').textContent = doctor.subtitle;
            document.getElementById('doctor-name').innerHTML = doctor.name;
            document.getElementById('spec-desc').textContent = doctor.specialization;
            document.getElementById('edu-desc').textContent = doctor.education;
            document.getElementById('exp-desc').textContent = doctor.experience;
            document.getElementById('improve-desc').textContent = doctor.improvement;
            document.getElementById('time-desc').textContent = doctor.schedule;
            
            const plainName = doctor.name.replace(/<br>/g, ' ');
            document.title = `${plainName} | Dental Club`;
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function initMenu() {
                const burgerIcon = document.getElementById('burgerIcon');
                const mobileMenu = document.getElementById('mobileMenu');
                const menuOverlay = document.getElementById('menuOverlay');
                const closeMenuBtn = document.getElementById('closeMenuBtn');
                const body = document.body;

                if (!burgerIcon) {
                    const headerPlaceholder = document.getElementById('header-placeholder');
                    if (headerPlaceholder && headerPlaceholder.innerHTML === '') {
                        headerPlaceholder.innerHTML = `
                            <header>
                                <div class="header-container">
                                    <div class="logo">
                                        <a href="index.html">
                                            <img src="../assets/images/logo.svg" alt="Dental Club">
                                        </a>
                                    </div>
                                    <div class="header-right">
                                        <button class="menu-btn">МЕНЮ</button>
                                        <div class="lang-selector">RUS</div>
                                        <a href="#" class="login-link">ВОЙТИ</a>
                                        <div class="burger-icon" id="burgerIcon">
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                        </div>
                                    </div>
                                </div>
                            </header>
                        `;
                    }
                    const newBurgerIcon = document.getElementById('burgerIcon');
                    if (newBurgerIcon) {
                        attachEvents(newBurgerIcon, mobileMenu, menuOverlay, closeMenuBtn, body);
                    }
                    return;
                }
                
                attachEvents(burgerIcon, mobileMenu, menuOverlay, closeMenuBtn, body);
            }
            
            function attachEvents(burgerIcon, mobileMenu, menuOverlay, closeMenuBtn, body) {
                function openMenu() {
                    if (burgerIcon) burgerIcon.classList.add('active');
                    if (mobileMenu) mobileMenu.classList.add('active');
                    if (menuOverlay) menuOverlay.classList.add('active');
                    body.classList.add('menu-open');
                }

                function closeMenu() {
                    if (burgerIcon) burgerIcon.classList.remove('active');
                    if (mobileMenu) mobileMenu.classList.remove('active');
                    if (menuOverlay) menuOverlay.classList.remove('active');
                    body.classList.remove('menu-open');
                }

                if (burgerIcon) {
                    const newBurgerIcon = burgerIcon.cloneNode(true);
                    burgerIcon.parentNode.replaceChild(newBurgerIcon, burgerIcon);
                    
                    newBurgerIcon.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (mobileMenu && mobileMenu.classList.contains('active')) {
                            closeMenu();
                        } else {
                            openMenu();
                        }
                    });
                }

                if (closeMenuBtn) {
                    closeMenuBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        closeMenu();
                    });
                }

                if (menuOverlay) {
                    menuOverlay.addEventListener('click', closeMenu);
                }

                const mobileLinks = document.querySelectorAll('.mobile-menu-btn, .mobile-lang-selector, .mobile-login-link, .mobile-link');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', closeMenu);
                });

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 992 && mobileMenu && mobileMenu.classList.contains('active')) {
                        closeMenu();
                    }
                });
            }
            
            setTimeout(initMenu, 100);
            setTimeout(initMenu, 500);
        });
    </script>
    <script src="../js/modal-appointment.js"></script>

</body>
</html>
