<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | Dental Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap">
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
    <div class="forgot-wrapper">
        <div class="forgot-container">
            <div class="forgot-card">
                <div class="forgot-header">
                    <a href="index.html" class="forgot-logo">
                        <img src="assets/images/logo.png" alt="Dental Club">
                    </a>
                    <h1>ВОССТАНОВЛЕНИЕ ПАРОЛЯ</h1>
                    <p>Введите email или номер телефона, чтобы сбросить пароль</p>
                </div>

                <form id="forgotForm" class="forgot-form">
                    <div class="forgot-form-group">
                        <label for="resetEmail">Email или телефон</label>
                        <input type="text" id="resetEmail" name="resetEmail" placeholder="example@mail.com или +7 (XXX) XXX-XX-XX" required>
                        <span class="forgot-error-message" id="resetEmailError"></span>
                    </div>

                    <button type="submit" class="forgot-btn forgot-btn-primary">ОТПРАВИТЬ КОД</button>

                    <div class="forgot-footer">
                        <p><a href="login.html">← Вернуться ко входу</a></p>
                    </div>
                </form>

                <form id="verifyCodeForm" class="forgot-form" style="display: none;">
                    <div class="forgot-form-group">
                        <label for="verificationCode">Код подтверждения</label>
                        <div class="forgot-code-inputs">
                            <input type="text" maxlength="1" class="code-digit" data-index="0" autofocus>
                            <input type="text" maxlength="1" class="code-digit" data-index="1">
                            <input type="text" maxlength="1" class="code-digit" data-index="2">
                            <input type="text" maxlength="1" class="code-digit" data-index="3">
                            <input type="text" maxlength="1" class="code-digit" data-index="4">
                            <input type="text" maxlength="1" class="code-digit" data-index="5">
                        </div>
                        <span class="forgot-error-message" id="codeError"></span>
                        <p class="forgot-resend-text">
                            Не пришел код? 
                            <button type="button" id="resendCodeBtn" class="forgot-resend-btn">Отправить снова</button>
                        </p>
                    </div>

                    <button type="submit" class="forgot-btn forgot-btn-primary">ПОДТВЕРДИТЬ</button>

                    <div class="forgot-footer">
                        <p><a href="login.html">← Вернуться ко входу</a></p>
                    </div>
                </form>

                <form id="resetPasswordForm" class="forgot-form" style="display: none;">
                    <div class="forgot-form-group">
                        <label for="newPassword">Новый пароль</label>
                        <div class="forgot-password-wrapper">
                            <input type="password" id="newPassword" name="newPassword" placeholder="Минимум 6 символов" required>
                            <button type="button" class="forgot-toggle-password" data-target="newPassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="forgot-error-message" id="newPasswordError"></span>
                    </div>

                    <div class="forgot-form-group">
                        <label for="confirmNewPassword">Подтверждение пароля</label>
                        <div class="forgot-password-wrapper">
                            <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Повторите пароль" required>
                            <button type="button" class="forgot-toggle-password" data-target="confirmNewPassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="forgot-error-message" id="confirmNewPasswordError"></span>
                    </div>

                    <button type="submit" class="forgot-btn forgot-btn-primary">СОХРАНИТЬ ПАРОЛЬ</button>

                    <div class="forgot-footer">
                        <p><a href="login.html">← Вернуться ко входу</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/forgot-password.js"></script>
</body>
</html>
