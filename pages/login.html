<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Dental Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/modal-profile.css">
        <link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/special-version.css">

<script src="../js/special-version.js"></script>

</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <a href="../index.html" class="login-logo">
                        <img src="../assets/images/logo/logo4.png" alt="Dental Club">
                    </a>
                    <h1>ВХОД В АККАУНТ</h1>
                    <p>Добро пожаловать обратно!</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="login-form-group">
                        <label for="loginEmail">Email или телефон</label>
                        <input type="text" id="loginEmail" name="loginEmail" placeholder="example@mail.com или +375 (29) 123-45-67" required>
                        <span class="login-error-message" id="loginEmailError"></span>
                    </div>

                    <div class="login-form-group">
                        <label for="loginPassword">Пароль</label>
                        <div class="login-password-wrapper">
                            <input type="password" id="loginPassword" name="loginPassword" placeholder="Введите пароль" required>
                            <button type="button" class="login-toggle-password" data-target="loginPassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="login-error-message" id="loginPasswordError"></span>
                    </div>

                    <div class="login-form-group login-options-group">
                        <label class="login-checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="login-checkmark"></span>
                            Запомнить меня
                        </label>
                    </div>

                    <button type="submit" class="login-btn login-btn-primary">ВОЙТИ</button>

                    <div class="login-footer">
                        <p>Нет аккаунта? <a href="signup.html">Зарегистрироваться</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/modal-profile.js"></script>
</body>
</html>
