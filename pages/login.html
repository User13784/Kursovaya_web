<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Dental Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/modal-profile.css">

</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <a href="../index.html" class="login-logo">
                        <img src="../assets/images/logo/logo4.png" alt="Dental Club">
                    </a>
                    <h1>ВХОД В АККАУНТ</h1>
                    <p>Добро пожаловать обратно!</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="login-form-group">
                        <label for="loginEmail">Email или телефон</label>
                        <input type="text" id="loginEmail" name="loginEmail" placeholder="example@mail.com или +7 (XXX) XXX-XX-XX" required>
                        <span class="login-error-message" id="loginEmailError"></span>
                    </div>

                    <div class="login-form-group">
                        <label for="loginPassword">Пароль</label>
                        <div class="login-password-wrapper">
                            <input type="password" id="loginPassword" name="loginPassword" placeholder="Введите пароль" required>
                            <button type="button" class="login-toggle-password" data-target="loginPassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="login-error-message" id="loginPasswordError"></span>
                    </div>

                    <div class="login-form-group login-options-group">
                        <label class="login-checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="login-checkmark"></span>
                            Запомнить меня
                        </label>
                        <a href="forgot-password.html" class="login-forgot-link">Забыли пароль?</a>
                    </div>

                    <button type="submit" class="login-btn login-btn-primary">ВОЙТИ</button>

                    <div class="login-footer">
                        <p>Нет аккаунта? <a href="signup.html">Зарегистрироваться</a></p>
                    </div>
                </form>

                <div class="login-divider">
                    <span>ИЛИ</span>
                </div>

                <div class="login-social">
                    <button type="button" class="login-social-btn google">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="login-social-btn apple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17.36 3 13.16 5.32 10.3c1.16-1.44 3.01-2.35 4.78-2.37 1.5-.02 2.92.99 3.84.99.92 0 2.64-1.22 4.46-1.04.76.03 2.89.31 4.26 2.33-.11.07-2.55 1.49-2.52 4.45.03 2.52 2.2 3.36 2.27 3.38-.02.07-.35 1.21-1.16 2.4zM16.32 4.9c.74-.9 1.23-2.14 1.1-3.4-.86.04-1.95.57-2.59 1.29-.6.68-1.12 1.66-1 2.71.92.07 1.86-.48 2.49-1.2z"/>
                        </svg>
                        Apple
                    </button>
                </div>

                <div class="login-demo">
                    <p>📋 Демо-данные для входа:</p>
                    <code>user@example.com</code> или <code>+7 777 123 45 67</code>
                    <code>Пароль: 123456</code>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
    <script src="../js/modal-profile.js"></script>

</body>
</html>
