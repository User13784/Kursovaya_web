<header class="header">
    <div class="header-container">
        <div class="header-left">
            <div class="menu-btn" id="menuBtn">
                <img src="assets/images/logo/logo2.png" alt="Menu Logo" class="menu-logo">
                <span id="menuText" data-translate="menu">МЕНЮ</span>
            </div>
            
            <div class="lang-selector" id="headerLangSelector">
                <img src="assets/images/logo/logo3.png" alt="Lang" class="lang-logo">
                <span id="langSelectorText">АНГЛ</span>
            </div>
            
            <div class="theme-switcher" id="themeSwitcher">
                <span class="theme-icon theme-dark" title="Тёмная тема">🌙</span>
                <span class="theme-icon theme-light" title="Светлая тема">☀️</span>
                <span class="theme-icon theme-system" title="Системная тема">💻</span>
            </div>
        </div>
        
        <div class="logo">
            <a href="index.html">
                <img src="assets/images/logo/logo1.png" alt="Dental Club Logo">
            </a>
        </div>
        
        <div class="header-right">
            <div class="auth-group">
                <a id="specialButton" href="#" class="special-button" title="Настройки для слабовидящих">
                    👁️
                </a>
                <div class="desktop-login" id="desktopLoginContainer">
                    <a href="#" class="login-link" id="desktopLoginLink" data-translate="login">ВОЙТИ</a>
                </div>
            </div>
            <div class="burger-icon" id="burgerIcon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
    <div class="header-stripe"></div>
</header>

<style>
.theme-switcher {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 40px;
    padding: 4px;
    margin-left: 5px;
}

.theme-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    transition: all 0.3s ease;
    background: transparent;
    opacity: 0.6;
}

.theme-icon:hover {
    opacity: 1;
    transform: scale(1.05);
    background: rgba(255, 255, 255, 0.2);
}

.theme-icon.active {
    opacity: 1;
}

.auth-group {
    display: flex;
    align-items: center;
    gap: 20px;
}

.special-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: rgba(165, 195, 60, 0.15);
    border-radius: 50%;
    transition: all 0.3s ease;
    text-decoration: none;
    cursor: pointer;
    font-size: 22px;
    border: 1px solid rgba(165, 195, 60, 0.3);
}

.special-button:hover {
    transform: scale(1.05);
    background: rgba(165, 195, 60, 0.3);
    border-color: #A5C33C;
}

.desktop-login {
    display: flex;
    align-items: center;
}

.login-link {
    text-decoration: none;
    color: white;
    font-size: 18px;
    transition: opacity 0.3s ease;
    white-space: nowrap;
}

.login-link:hover {
    opacity: 0.8;
}

@media screen and (max-width: 980px) {
    .special-button {
        width: 36px;
        height: 36px;
        font-size: 20px;
    }
    .auth-group {
        gap: 15px;
    }
}

@media screen and (max-width: 768px) {
    .theme-switcher {
        gap: 4px;
        padding: 3px;
    }
    .theme-icon {
        width: 28px;
        height: 28px;
        font-size: 14px;
    }
    .special-button {
        width: 32px;
        height: 32px;
        font-size: 18px;
    }
    .login-link {
        font-size: 16px;
    }
    .auth-group {
        gap: 12px;
    }
}

@media screen and (max-width: 480px) {
    .theme-switcher {
        gap: 2px;
        padding: 2px;
    }
    .theme-icon {
        width: 24px;
        height: 24px;
        font-size: 12px;
    }
    .special-button {
        width: 28px;
        height: 28px;
        font-size: 16px;
    }
    .login-link {
        font-size: 14px;
    }
    .auth-group {
        gap: 8px;
    }
}


.header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
}

.header-left {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    padding: 0;
}

.header-right {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 15px;
}

@media screen and (min-width: 769px) and (max-width: 1000px) {
    .menu-btn,
    .lang-selector,
    .theme-switcher {
        display: none !important;
    }
    
    .special-button,
    .desktop-login {
        display: none !important;
    }
    
    .burger-icon {
        display: flex !important;
    }
    
    .logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
}


@media screen and (max-width: 992px) {
    .menu-btn span,
    .lang-selector span,
    .login-link {
        display: none !important;
    }
    
    .menu-btn img,
    .lang-selector img {
        display: block !important;
    }
}

@media screen and (max-width: 768px) {
    .menu-btn,
    .lang-selector {
        display: none !important;
    }
    
    .theme-switcher {
        display: none !important;
    }
    
    .special-button {
        display: none !important;
    }
    
    .login-link {
        display: none !important;
    }
    
    .burger-icon {
        display: flex !important;
    }
    
    .logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    
    .header-left {
        flex: 0;
    }
    
    .header-right {
        flex: 0;
        gap: 5px;
    }
}

@media screen and (max-width: 480px) {
    .logo img {
        max-height: 35px;
        width: auto;
    }
}
</style>

<link rel="stylesheet" href="css/special-version.css">
<script src="js/special-version.js"></script>

<script>
(function() {
    function updateLangButtonText() {
        const currentLang = localStorage.getItem('dental_language') || 'ru';
        const langText = document.getElementById('langSelectorText');
        if (langText) {
            if (currentLang === 'ru') {
                langText.textContent = 'АНГЛ';
            } else {
                langText.textContent = 'RUS';
            }
        }
    }

    function updateLoginButtonText() {
        const currentLang = localStorage.getItem('dental_language') || 'ru';
        const loginLink = document.getElementById('desktopLoginLink');
        
        if (loginLink) {
            loginLink.textContent = currentLang === 'ru' ? 'ВОЙТИ' : 'LOGIN';
            loginLink.setAttribute('data-translate', 'login');
        }
        
        const mobileLoginLinks = document.querySelectorAll('.mobile-login-link');
        mobileLoginLinks.forEach(function(link) {
            if (link) {
                link.textContent = currentLang === 'ru' ? 'ВОЙТИ' : 'LOGIN';
                link.setAttribute('data-translate', 'login');
            }
        });
        
        if (typeof window.updateAuthUI === 'function') {
            setTimeout(function() {
                window.updateAuthUI();
            }, 10);
        }
    }

    function updateMenuButtonText() {
        const currentLang = localStorage.getItem('dental_language') || 'ru';
        const menuText = document.getElementById('menuText');
        if (menuText) {
            menuText.textContent = currentLang === 'ru' ? 'МЕНЮ' : 'MENU';
        }
    }

    function initThemeSwitcher() {
        const themeSwitcher = document.getElementById('themeSwitcher');
        if (!themeSwitcher) return;
        const themeIcons = {
            dark: themeSwitcher.querySelector('.theme-dark'),
            light: themeSwitcher.querySelector('.theme-light'),
            system: themeSwitcher.querySelector('.theme-system')
        };
        let currentTheme = localStorage.getItem('dental_theme') || 'system';
        function setActiveIcon(theme) {
            Object.keys(themeIcons).forEach(key => {
                if (themeIcons[key]) {
                    if (key === theme) themeIcons[key].classList.add('active');
                    else themeIcons[key].classList.remove('active');
                }
            });
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('dental_theme', theme);
            setActiveIcon(theme);
        }
        applyTheme(currentTheme);
        if (themeIcons.dark) themeIcons.dark.addEventListener('click', (e) => { e.preventDefault(); applyTheme('dark'); });
        if (themeIcons.light) themeIcons.light.addEventListener('click', (e) => { e.preventDefault(); applyTheme('light'); });
        if (themeIcons.system) themeIcons.system.addEventListener('click', (e) => { e.preventDefault(); applyTheme('system'); });
    }

    function getPath(path) {
        const currentPath = window.location.pathname;
        const isInPages = currentPath.includes('/pages/');
        if (path === 'menu') return isInPages ? 'menu.html' : 'pages/menu.html';
        if (path === 'login') return isInPages ? 'login.html' : 'pages/login.html';
        if (path === 'index') return isInPages ? '../index.html' : 'index.html';
        return path;
    }

    function initButtons() {
        const menuBtn = document.getElementById('menuBtn');
        if (menuBtn) {
            const newMenuBtn = menuBtn.cloneNode(true);
            menuBtn.parentNode.replaceChild(newMenuBtn, menuBtn);
            newMenuBtn.addEventListener('click', (e) => { e.preventDefault(); window.location.href = getPath('menu'); });
        }
        
        const langSelector = document.getElementById('headerLangSelector');
        if (langSelector) {
            const newLangSelector = langSelector.cloneNode(true);
            langSelector.parentNode.replaceChild(newLangSelector, langSelector);
            newLangSelector.addEventListener('click', (e) => { 
                e.preventDefault(); 
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage();
                } else {
                    const newLang = localStorage.getItem('dental_language') === 'ru' ? 'en' : 'ru';
                    localStorage.setItem('dental_language', newLang);
                    updateLangButtonText();
                    updateLoginButtonText();
                    updateMenuButtonText();
                    const event = new CustomEvent('languageChanged', { detail: { language: newLang } });
                    document.dispatchEvent(event);
                }
            });
        }
        
        const desktopLoginLink = document.getElementById('desktopLoginLink');
        if (desktopLoginLink) {
            const newLoginLink = desktopLoginLink.cloneNode(true);
            desktopLoginLink.parentNode.replaceChild(newLoginLink, desktopLoginLink);
            newLoginLink.addEventListener('click', (e) => { e.preventDefault(); const isInPages = window.location.pathname.includes('/pages/'); window.location.href = isInPages ? 'login.html' : 'pages/login.html'; });
        }
        
        const logoLink = document.querySelector('.logo a');
        if (logoLink) {
            const newLogoLink = logoLink.cloneNode(true);
            logoLink.parentNode.replaceChild(newLogoLink, logoLink);
            newLogoLink.addEventListener('click', (e) => { e.preventDefault(); window.location.href = getPath('index'); });
        }
    }

    document.addEventListener('languageChanged', function() {
        updateLangButtonText();
        updateLoginButtonText();
        updateMenuButtonText();
    });

    initButtons();
    updateLangButtonText();
    updateLoginButtonText();
    updateMenuButtonText();
    initThemeSwitcher();

    function waitForAuthAndUpdate() {
        if (typeof window.updateAuthUI === 'function') {
            window.updateAuthUI();
        } else {
            setTimeout(waitForAuthAndUpdate, 100);
        }
    }
    setTimeout(waitForAuthAndUpdate, 100);
    
    document.addEventListener('DOMContentLoaded', function() {
        updateLoginButtonText();
    });
})();
</script>
